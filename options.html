<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>واژه‌بان</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">افزونهٔ فایرفاکس</p>
        <h1>واژه‌بان</h1>
      </div>
      <div class="toolbar">
        <label class="button secondary" for="import-file">واژه‌های خودت را وارد کن</label>
        <input id="import-file" type="file" accept=".json,application/json" hidden>
        <button id="export" class="button secondary" type="button">پشتیبان بگیر</button>
      </div>
    </header>

    <section class="half-space-settings card" aria-labelledby="half-space-title">
      <div class="half-space-heading">
        <h2 id="half-space-title">قواعد رسم‌الخط (فاصله‌گذاری) بر اساس ویراست دوم از کتاب <em>دستور خطِ فارسی</em></h2>
        <span>هر قاعده را می‌توانی جداگانه روشن یا خاموش کنی.</span>
      </div>
      <label class="setting-row" for="half-space-mi">
        <input id="half-space-mi" type="checkbox" checked>
        <span class="setting-copy">
          <strong>نیم‌فاصله‌دار کردنِ پیشوند «می/نمی»</strong>
          <small>مثلاً: می روم ← می‌روم؛ نمی نویسم ← نمی‌نویسم</small>
          <small>قاعده بر پایهٔ شکل نوشتاری است و فعل‌بودن واژه را تشخیص نمی‌دهد.</small>
        </span>
      </label>
      <label class="setting-row" for="half-space-ha">
        <input id="half-space-ha" type="checkbox" checked>
        <span class="setting-copy">
          <strong>نیم‌فاصله‌دار کردنِ نشانهٔ جمع «ها»</strong>
          <small>مثلاً: کتاب ها و کتابها ← کتاب‌ها؛ کتاب هایم و کتابهایم ← کتاب‌هایم</small>
          <small>واژه‌های مستقلی مانند «تنها» و «رها» استثنا هستند.</small>
        </span>
      </label>
      <label class="setting-row" for="half-space-suffix">
        <input id="half-space-suffix" type="checkbox" checked>
        <span class="setting-copy">
          <strong>نیم‌فاصله‌دار کردنِ شناسه‌های فعلی «ام/ای/ایم/اید/اند» پس از واژه‌های مختوم به «ه»</strong>
          <small>مثلاً: رفته ام ← رفته‌ام یا نرفته ام ← نرفته‌ام</small>
        </span>
      </label>
      <label class="setting-row" for="half-space-bi">
        <input id="half-space-bi" type="checkbox" checked>
        <span class="setting-copy">
          <strong>نیم‌فاصله‌دار کردنِ پیشوند نفی «بی»</strong>
          <small>مثلاً: بی تردید، بی حساب و بیتوجه ← بی‌تردید، بی‌حساب و بی‌توجه</small>
          <small>این قاعده فقط نمونه‌های شناخته‌شدهٔ کتاب را تصحیح می‌کند؛ استثناهایی مثل «بیکار» و «بیهوده» دست‌نخورده می‌مانند.</small>
        </span>
      </label>
      <label class="setting-row" for="half-space-comparative">
        <input id="half-space-comparative" type="checkbox" checked>
        <span class="setting-copy">
          <strong>نیم‌فاصله‌دار کردنِ پسوندهای «تر/ترین»</strong>
          <small>مثلاً: بزرگ تر و بزرگترین ← بزرگ‌تر و بزرگ‌ترین</small>
          <small>صورت‌هایی مثل «بهتر» و «بیشتر» پیوسته می‌مانند.</small>
        </span>
      </label>
      <label class="setting-row" for="half-space-ham">
        <input id="half-space-ham" type="checkbox" checked>
        <span class="setting-copy">
          <strong>نیم‌فاصله‌دار کردنِ ترکیب‌های شناخته‌شده با «هم»</strong>
          <small>مثلاً: هم بازی و همبازی ← هم‌بازی</small>
          <small>این قاعده به فهرست نمونه‌های کتاب محدود است تا واژه‌هایی مثل «همکار» پیوسته بمانند.</small>
        </span>
      </label>
      <label class="setting-row" for="half-space-ya">
        <input id="half-space-ya" type="checkbox" checked>
        <span class="setting-copy">
          <strong>درست‌نویسیِ یای نکره، مصدری و نسبت</strong>
          <small>مثلاً: خانه ای، گره ای، کتاب ای و دانشجو ای ← خانه‌ای، گرهی، کتابی و دانشجویی</small>
          <small>شکل واژه با توجه به حرف پایانی آن تعیین می‌شود.</small>
        </span>
      </label>
    </section>

    <section class="editor card" aria-label="افزودن یا ویرایش واژه">
      <div class="field">
        <label for="trigger">اگر این را تایپ کردم</label>
        <input id="trigger" type="text" autocomplete="off" placeholder="مثلاً: انظباط">
      </div>
      <div class="arrow" aria-hidden="true">←</div>
      <div class="field">
        <label for="replacement">تصحیحش کن به</label>
        <input id="replacement" type="text" autocomplete="off" placeholder="مثلاً: انضباط">
      </div>
      <button id="save" class="button primary" type="button">افزودن واژه</button>
      <button id="cancel-edit" class="button secondary" type="button" hidden>لغو ویرایش</button>
    </section>

    <section class="list card">
      <div class="list-heading">
        <div>
          <h2>بانک واژه‌ها</h2>
          <span id="count" class="count">در حال بارگذاری…</span>
        </div>
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="10.8" cy="10.8" r="6.3"></circle>
            <path d="m15.5 15.5 4.2 4.2"></path>
          </svg>
          <input id="search" class="search" type="search" placeholder="جست‌وجو در واژه‌ها" aria-label="جست‌وجو در واژه‌ها">
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>صورت غلط/نامرجّح</th><th>صورت صحیح/مرجّح</th><th class="actions-heading">ویرایش/حذف</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <p id="empty" class="empty" hidden>واژه‌ای پیدا نشد.</p>
      </div>
      <div class="list-footer">
        <span>برای اصلاح هر مورد، «ویرایش» را بزن.</span>
        <button id="reset" class="text-button" type="button">بازگردانی بانک آغازین</button>
      </div>
    </section>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
